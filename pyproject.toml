[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "systemone-vision-test"
version = "0.1.0"
description = "System Oneによる視力検査もどき（ランドルト環ベース。clef / clef-flash / jev 対応）"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "naraba" }
]
dependencies = [
    "PySide6>=6.5.0",
    "opencv-python>=4.8.0",
    "numpy>=1.24",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.4",
]

[project.scripts]
systemone-vision-test = "systemone_vision_test.gui.app:main"
systemone-vision-benchmark = "systemone_vision_test.benchmark.cli:main"

[project.urls]
Homepage = "https://github.com/naraba/systemone-vision-test"
Repository = "https://github.com/naraba/systemone-vision-test"
Issues = "https://github.com/naraba/systemone-vision-test/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["systemone_vision_test*"]

# ---------------------------------------------------------------------------
# テスト
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q -m 'not integration' --strict-markers"
markers = [
    "integration: 実際の clef API（Ollama）が必要なテスト。`pytest -m integration` で実行する",
    "allow_network: 実ネットワーク I/O を伴うが環境に依存しないテスト（到達不可アドレスへの確認など）",
]

# ---------------------------------------------------------------------------
# リンタ・フォーマッタ
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [".venv", "artifacts", "image"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "PTH", "RET", "PERF", "FURB", "BLE"]
# 日本語コメント・文字列の全角記号は許容する
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Qt のオーバーライド（paintEvent / closeEvent など）とテストのプライベート参照を許可
"src/systemone_vision_test/gui/*.py" = ["N802", "N815"]
"tests/*.py" = ["N802", "SLF001"]
# スクリプトは src レイアウト用のブートストラップの後で import するため
"scripts/*.py" = ["E402"]
